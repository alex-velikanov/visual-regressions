name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fast:
    # No browser, no model: filter, baseline rotation, report parsing, pages.json rules, logins, link rules, the pipeline with stubs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: ./test.sh fast

  browser:
    # The scripts in a real headless Chromium against a local test site (no model). The judge tier uses plan tokens and runs by hand.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: npm install --no-audit --no-fund && npx playwright install --with-deps chromium
      - run: ./test.sh browser
